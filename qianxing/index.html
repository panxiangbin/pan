<style>
:root{--paper:#fafbf9;--ink:#1c3443;--soft:#526775;--line:#dfe8e7;--navy:#194c63;--teal:#148b83;--mint:#e7f4ef;--cream:#fff7e8;--border:#d8e5e4;--shadow:0 15px 45px rgba(22,57,64,.07)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #78beb3;outline-offset:2px}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 28px}.top{position:sticky;top:0;background:rgba(250,251,249,.96);border-bottom:1px solid var(--line);z-index:50;backdrop-filter:blur(10px)}.topinner{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;color:var(--navy);white-space:nowrap}.logo{display:grid;place-items:center;width:35px;height:35px;background:var(--navy);color:white;border-radius:12px;font-size:22px}.topnav{display:flex;flex-wrap:wrap;gap:3px}.navlink{border:0;background:none;color:var(--soft);border-radius:24px;padding:8px 13px;font-size:13px}.navlink:hover,.navlink.active{background:var(--mint);color:var(--navy)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border:1px solid var(--navy);border-radius:12px;font-weight:600;background:white;color:var(--navy);transition:.15s}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px #15466018}.btn.primary{background:var(--navy);color:white}.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn.small{min-height:36px;padding:5px 12px;font-size:12px}.badge{display:inline-block;border-radius:30px;padding:4px 11px;background:var(--mint);color:#13736c;font-size:12px;font-weight:700}.muted{color:var(--soft)}.tiny{font-size:12px}.hero{padding:90px 0 82px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;right:-200px;top:-360px;width:900px;height:900px;border:1px solid #d6e7e4;border-radius:50%;pointer-events:none}.hero:after{content:"";position:absolute;right:-95px;top:-250px;width:600px;height:600px;border:1px solid #d6e7e4;border-radius:50%;pointer-events:none}.hero-grid{position:relative;display:grid;grid-template-columns:1.35fr .65fr;gap:60px;align-items:center}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--teal);text-transform:uppercase}.hero h1{font-size:clamp(39px,5vw,64px);line-height:1.18;letter-spacing:-1.7px;color:var(--navy);margin:20px 0 24px;font-weight:800}.hero p{font-size:17px;color:var(--soft);max-width:650px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0 15px}.orbit{width:100%;aspect-ratio:1;max-width:330px;border:1px dashed #c8ddda;border-radius:50%;position:relative;margin:auto;display:grid;place-items:center}.orbit:before{content:"";width:64%;height:64%;border:1px solid #bcd8d3;border-radius:50%}.orbit .core{position:absolute;display:grid;place-items:center;width:92px;height:92px;border-radius:26px;background:var(--navy);color:#fff;font-size:42px;box-shadow:0 15px 35px #194c6328}.orbit .dot{position:absolute;width:14px;height:14px;border:4px solid var(--paper);background:var(--teal);border-radius:50%;box-shadow:0 0 0 1px #aad8d0}.orbit .d1{top:9%;left:35%}.orbit .d2{right:1%;top:52%}.orbit .d3{bottom:7%;left:21%}.orbit .d4{left:4%;top:27%}.section{padding:60px 0}.section.soft{background:#f1f7f5}.section h2,.page-title{font-size:31px;line-height:1.32;color:var(--navy);letter-spacing:-.5px;margin:9px 0 14px}.intro{max-width:780px;color:var(--soft);margin:0 0 25px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid var(--border);border-radius:19px;background:#fff;padding:23px;box-shadow:var(--shadow)}.card h3{font-size:18px;color:var(--navy);margin:12px 0 10px}.card p{margin:0;color:var(--soft);font-size:14px}.symbol{height:43px;width:43px;border-radius:13px;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:23px}.stepno{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:2px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:35px}.stat{background:#fff;border:1px solid var(--border);border-radius:15px;padding:22px}.stat strong{display:block;font-size:30px;color:var(--navy)}.page-head{background:#f1f7f5;border-bottom:1px solid var(--border);padding:48px 0}.page-head p{max-width:780px;color:var(--soft)}.page-head .eyebrow{margin-bottom:10px}.grid-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;padding-top:24px}.mapitem{border:1px solid var(--border);border-radius:16px;background:#fff;padding:19px;min-height:206px}.mapitem h3{margin:8px 0;font-size:17px}.mapitem .tag{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:1px}.mapitem p{font-size:13px;margin:5px 0;color:var(--soft)}.mapitem .foot{border-top:1px solid var(--line);padding-top:9px;margin-top:13px;font-size:12px;color:#5d7480}.note{border:1px solid #c9ded5;background:#eefaef;padding:15px 18px;border-radius:14px;color:#31584f;font-size:14px;margin:25px 0}.warning{border:1px solid #eadbc8;background:#fff8ed;border-radius:14px;padding:16px 18px;font-size:13px;color:#715834;margin:17px 0}.experiments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:25px 0}.expcard{background:white;border:1px solid var(--border);padding:24px;border-radius:19px}.expcard h3{font-size:20px;margin:12px 0 8px;color:var(--navy)}.expcard p{font-size:14px;color:var(--soft);min-height:65px}.expcard .row{display:flex;gap:9px;justify-content:space-between;align-items:center}.task{max-width:830px;margin:28px auto;border:1px solid var(--border);border-radius:20px;background:white;padding:28px;box-shadow:var(--shadow)}.taskhead{display:flex;gap:14px;align-items:center;justify-content:space-between}.task h3{font-size:23px;margin:12px 0;color:var(--navy)}.stagebar{height:8px;background:#e6efed;border-radius:20px;overflow:hidden;margin:14px 0 22px}.stagebar div{height:100%;background:var(--teal);transition:.2s}.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:19px 0}.choice{border:1px solid #c5dcd5;border-radius:12px;padding:12px 18px;background:#fff;min-width:130px}.choice:hover{background:#e8f5f1}.svgboard{min-height:215px;background:#f5f9f8;border:1px solid var(--line);border-radius:17px;display:grid;place-items:center;overflow:hidden;margin:18px 0}.center{text-align:center}.round{font-size:12px;color:var(--teal);letter-spacing:1px;font-weight:800}.feedback{padding:15px 20px;border-radius:13px;background:var(--mint);margin:16px 0;line-height:1.7}.control-row{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:13px 0}.control-row input{width:100%;accent-color:var(--teal)}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.result{border:1px solid var(--border);background:#f9fcfa;border-radius:14px;padding:13px}.result b{display:block;font-size:22px;color:var(--teal)}.textinput{display:block;width:100%;min-height:96px;padding:13px;border-radius:12px;border:1px solid #c7dad5;resize:vertical;background:#fff;color:var(--ink)}.field{display:block;font-size:13px;font-weight:600;margin:18px 0 6px}.recorditem{display:flex;gap:13px;align-items:start;justify-content:space-between;border-bottom:1px solid var(--border);padding:17px 0}.recorditem b{display:block}.empty{padding:50px 20px;text-align:center;border:1px dashed var(--border);color:var(--soft);border-radius:16px}.sources a{color:#096c78;text-decoration:underline;text-underline-offset:3px}.sources li{margin:15px 0}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}.tab{background:#fff;border:1px solid var(--border);border-radius:25px;padding:8px 17px}.tab.active{background:var(--navy);color:#fff}.table{border-collapse:collapse;width:100%}.table td,.table th{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}.table th{color:var(--navy);width:130px}.footer{border-top:1px solid var(--line);margin-top:40px;padding:30px 0 45px;font-size:13px;color:var(--soft)}.footerinner{display:flex;gap:20px;justify-content:space-between}.hint{font-size:13px;color:var(--soft);margin-top:10px}.pill{font-size:12px;border-radius:6px;color:#27746c;background:#e4f4ee;padding:3px 9px}.nowrap{white-space:nowrap}.radiocheck{display:flex;gap:10px;align-items:start;margin:14px 0}.radiocheck input{margin-top:6px;accent-color:var(--teal)}.task-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}svg{max-width:100%}#app{min-height:75vh}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border-radius:13px;background:var(--ink);color:white;padding:11px 20px;display:none;z-index:99;font-size:13px;box-shadow:var(--shadow)}
@media(max-width:870px){.topinner{flex-wrap:wrap;justify-content:center;padding:12px 0}.topnav{justify-content:center}.hero{padding:55px 0}.hero-grid{grid-template-columns:1fr}.orbit{display:none}.cards,.grid-map{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:0 18px}.brand{font-size:17px}.navlink{font-size:12px;padding:7px 10px}.hero h1{font-size:37px}.hero p{font-size:15px}.section{padding:39px 0}.section h2,.page-title{font-size:25px}.cards,.grid-map,.experiments{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.task{padding:18px;margin:15px auto}.task h3{font-size:20px}.control-row{grid-template-columns:86px 1fr 36px;font-size:13px}.results{grid-template-columns:1fr}.footerinner{flex-direction:column}.expcard p{min-height:0}.choice{min-width:120px}.taskhead{align-items:flex-start}}

<body>
<header class="top"><div class="wrap topinner"><a href="#home" class="brand"><span class="logo">✦</span><span>潜星计划</span></a><nav class="topnav" aria-label="网站导航"><button class="navlink" data-nav="home">首页</button><button class="navlink" data-nav="map">探索地图</button><button class="navlink" data-nav="experiences">互动体验</button><button class="navlink" data-nav="records">我的探索</button><button class="navlink" data-nav="research">研究方法</button></nav></div></header>
<main id="app" aria-live="polite"></main><div id="toast" role="status"></div>
<footer class="footer"><div class="wrap footerinner"><span>✦ 潜星计划 · 广域探索原型 V0.3</span><span>当前仅作研究性体验，不构成天赋鉴定或职业预测。本站无需注册。</span></div></footer>
<script>
"use strict";
const $=sel=>document.querySelector(sel),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='qianxing-exploration-v03';
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')||{records:[],prefs:{adult:false},version:'0.3'}}catch{state={records:[],prefs:{adult:false},version:'0.3'}};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const domains=[
['感官与细节','纹理、颜色、形状细微差异','质检观察、自然辨识、精细检查','比较材质细节；辨别陌生物体','观察研究'],
['声音与节奏','时间间隔、音色与节拍','声音编辑、设备调试、音乐制作','听两个短节奏；追踪声音模式','可体验'],
['空间结构','空间变换、物体旋转、布局','建筑、装配、图纸理解','转动物体并预测视角；结构折叠','可体验'],
['机械因果','部件相互作用与运动预测','设备维护、设计、装配排故','观察齿轮传递；发现卡顿原因','可体验'],
['逻辑与规律','陌生规则提取与反例发现','信息整理、编程、分析','符号推演；不完全信息判断','设计中'],
['语言与表达','解释复杂信息、转换语境','教学、沟通、内容创作','用不同方式阐述同一概念','设计中'],
['创意与多解','同一问题的多种方案','产品构思、艺术、流程创新','开放用途发想；限制条件变化','可体验'],
['动态系统规划','在变化约束下做取舍','物流调度、项目协调、资源配置','动态分配预算；根据结果再调整','可体验'],
['社会理解与协作','视角转换、协商与倾听','团队协作、社区服务、客户沟通','不同立场的沟通模拟','设计中'],
['身体协调与运动','身体时序、平衡与动作学习','体育、手作、表演、技能训练','安全的线下动作体验与观察','需线下'],
['精细操作','手眼配合、精确操作','仪器操作、手工制作、装配','操作速度与精度；不同材质练习','需线下'],
['记忆与信息组织','编码、关联、检索与重组','档案整理、学习、复杂信息跟踪','陌生信息整理；延迟再现','设计中'],
['自然观察与材料','对环境变化和物质细节敏感','园艺、环境观察、材料处理','识别自然规律；材料反应观察','需线下'],
['异常与风险洞察','在复杂变化中识别可疑信号','设备巡检、质量检查、流程预警','寻找异常序列；模拟告警','设计中'],
['学习迁移','接触新任务后的进步与迁移','跨学科学习、技能探索','短时指导后换任务再做','设计中']
];
const taskDefs=[['gear','机械因果探索','机械因果','观察齿轮之间的传动关系，先预测、再查看运动。','03'],['resource','动态资源调度','动态系统规划','在多轮变化的约束中尝试不同分配策略，观察系统反馈。','04'],['rhythm','声音节奏辨别','声音与节奏','听两组短节奏，判断是否相同，不需要音乐知识。','04'],['creative','创造性多解挑战','创意与多解','对同一物品提出不同用途；只记录你的想法，不以答案多少评价天赋。','02'],['rotate','空间结构旋转','空间结构','预测非对称结构旋转之后的样子，并即时验证。','05']];
const tasks=Object.fromEntries(taskDefs.map(x=>[x[0],{key:x[0],title:x[1],domain:x[2],desc:x[3],rounds:Number(x[4])}]));
let route='home',T=null;
function setRoute(v){location.hash=v;render();window.scrollTo(0,0)}function navTo(v){route=v;location.hash=v;render();window.scrollTo(0,0)}
function header(ey,title,sub){return `<section class="page-head"><div class="wrap"><div class="eyebrow">${ey}</div><h1 class="page-title">${title}</h1><p>${sub}</p></div></section>`}
function home(){return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">QIANXING · EXPLORATION RESEARCH</div><h1>寻找未曾有机会<br>展现的潜力</h1><p>人的成长环境，决定了他可能接触哪些活动、学习哪些技能。但这不代表他没有其他值得探索的能力。潜星计划尝试用跨领域体验与反复观察，为更多人创造发现不同可能性的机会。</p><div class="actions"><button class="btn primary" data-go="map">探索能力与场景地图 →</button><button class="btn" data-go="experiences">开始跨领域体验</button></div><span class="badge">研究性原型 V0.3 · 尚未通过正式信效度验证</span></div><div class="orbit" aria-hidden="true"><div class="core">✦</div><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i><i class="dot d4"></i></div></div></section><section class="section soft"><div class="wrap"><div class="eyebrow">HOW IT WORKS</div><h2>不是一次考试，而是一段探索过程</h2><p class="intro">每个领域都值得体验，每一次表现只是一条线索。系统既关注可能的优势，也提醒我们：从未接触过的领域，不能因一次困难就被排除。</p><div class="cards">${[['01','拓宽接触机会','尝试熟悉和陌生的活动，不预设自己适合什么。'],['02','观察不同表现','留意正确率、学习变化、解题策略以及个人体验。'],['03','跨任务再验证','换材料、换场景重复体验，避免把偶然发挥误认为稳定优势。']].map(([n,t,d])=>`<div class="card"><span class="stepno">${n}</span><h3>${t}</h3><p>${d}</p></div>`).join('')}</div><div class="stats"><div class="stat"><strong>${domains.length}</strong><span class="muted">个初步探索方向</span></div><div class="stat"><strong>${taskDefs.length}</strong><span class="muted">种已实现互动演示</span></div><div class="stat"><strong>${state.records.length}</strong><span class="muted">次本机记录的体验</span></div><div class="stat"><strong>0</strong><span class="muted">项已被本项目科学认证的能力</span></div></div></div></section><section class="section"><div class="wrap"><h2>重要的不是给人贴标签</h2><p class="intro">我们的目标是帮助人接触原本可能无缘体验的领域，再用可以复查的方法寻找有意义的表现。当前所有互动仅供成年人自愿体验，不用于学校筛选、升学决定或职业命运预测。</p><button class="btn" data-go="research">了解科学边界和研究方法</button></div></section>`}
function mapPage(){return `${header('EXPLORATION MAP','人类能力与现实场景探索地图','这些类别是帮助扩展体验范围的工作分类，不是已经得到证实的独立先天天赋。现实领域往往需要许多能力协同发挥。')}<div class="wrap"><div class="note">地图的作用是打开选择，而不是缩小选择。线上无法完整测量的动作、协作与材料实践，未来需要通过安全的线下体验补充。</div><div class="grid-map">${domains.map(([t,d,s,ex,status],i)=>`<article class="mapitem"><div class="tag">FIELD · ${String(i+1).padStart(2,'0')} <span class="pill" style="float:right">${status}</span></div><h3>${t}</h3><p>${d}</p><p><b>现实场景：</b>${s}</p><div class="foot"><b>可能的体验：</b>${ex}</div></article>`).join('')}</div><div class="actions"><button class="btn primary" data-go="experiences">体验目前可用的五种任务 →</button></div></div>`}
function experiences(){return `${header('INTERACTIVE EXPLORATION','跨领域互动体验中心','不同领域需要不同的体验方式。这里的微任务只用于探索过程，不作超常能力筛查，不向任何人提供先天天赋鉴定。')}<div class="wrap"><div class="warning">参与要求：当前互动实验只向已满18周岁的成年人开放。未成年人可浏览地图和研究资料，但不参与尚未验证的互动测评。</div><div class="experiments">${taskDefs.map(([k,title,dom,desc,rounds],i)=>`<article class="expcard"><div class="round">EXPERIMENT ${String(i+1).padStart(3,'0')} · ${dom}</div><h3>${title}</h3><p>${desc}</p><div class="row"><span class="badge">${Number(rounds)}个互动回合</span><button class="btn primary small" data-start="${k}">开始体验 →</button></div></article>`).join('')}</div><p class="hint">每项体验都允许重复进行。当前阶段没有人群常模，也没有资格据此推断职业适合度。</p></div>`}
function research(){return `${header('RESEARCH FRAMEWORK','我们的研究方法与边界','最初的设想值得研究，但必须允许实验反驳原始假说。原型展示了可能的任务形式，尚不能证明测评的可靠性和现实预测价值。')}<div class="wrap section"><div class="cards"><article class="card"><span class="stepno">WHY</span><h3>核心问题</h3><p>家庭、教育、成长环境和职业选择如何影响人接触不同领域的机会？我们能否通过丰富体验发现过去未表现的优势？</p></article><article class="card"><span class="stepno">WHAT</span><h3>实际观察什么</h3><p>任务内初始表现、少量指导后的变化、不同题材间迁移、重复观测，以及使用者自己的体验与兴趣。</p></article><article class="card"><span class="stepno">LIMITS</span><h3>不做什么断言</h3><p>不把高分直接定义为天生天赋，不从单项游戏推断职业或未来成就，不把兴趣强弱当作能力强弱。</p></article></div><div class="section"><h2>从问题到可检验假设</h2><table class="table"><tr><th>已知依据</th><td>个体差异客观存在，成长和训练环境影响能力发展与表现；这并不能证明每人都天生有一种超常能力。</td></tr><tr><th>待检验假设</th><td>低门槛、多领域互动能否发现常规经历没展示出来的稳定优势？同类表现能否跨任务复现？能否预测真实学习效果？</td></tr><tr><th>特别约束</th><td>必须控制练习效应、设备差异、文化经验、随机高分和多重比较；未经重复与外部验证不能命名为“能力因子”。</td></tr><tr><th>开放世界</th><td>已知能力可以系统验证；新任务可用于探索性研究，但未经验证不得宣称发现新的人类天赋类型。</td></tr></table></div><div class="section soft" style="padding:26px;border-radius:18px"><h2>研究推进路线</h2><div class="cards">${[['G0','理念与基础研究','已整理；原始命题尚无充分科学证据'],['G1','多领域交互原型','已实现可玩的技术演示；非有效测评'],['G2','成年人可用性测试','未开展：检验指导语、设备、交互与数据质量'],['G3','测量与预测验证','未开展：复测、对照、外部学习效标'],['G4','儿童研究伦理审查','未开始：需独立审查与监护人/儿童同意']].map(x=>`<div class="card"><div class="stepno">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div><div class="section sources"><h2>研究参考资料</h2><p class="intro">仅提供可核查的基础资料链接，来源不应被解释为已验证本项目。</p><ol><li>Richler 等（2019），<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6484857/" target="_blank" rel="noopener noreferrer">Individual Differences in Object Recognition</a>：陌生物体识别能力研究。</li><li><a href="https://www.onetcenter.org/" target="_blank" rel="noopener noreferrer">O*NET 官方职业能力资料</a>：工作所需的能力与活动分类，不是先天天赋测验。</li><li><a href="https://www.oecd.org/en/topics/sub-issues/creative-thinking.html" target="_blank" rel="noopener noreferrer">OECD 创造性思维研究</a>：提供创意思考的评估框架。</li><li><a href="https://www.jspsych.org/" target="_blank" rel="noopener noreferrer">jsPsych</a>：网页行为实验工具。</li></ol></div></div>`}
function records(){const rows=state.records||[];return `${header('MY EXPLORATION','我的探索记录','记录只存在当前浏览器本机，不与服务器同步。换设备或清理浏览器数据之前，可先自行导出备份。')}<div class="wrap section"><div class="stats" style="margin:0 0 22px"><div class="stat"><strong>${rows.length}</strong><span class="muted">累计体验次数</span></div><div class="stat"><strong>${new Set(rows.map(x=>x.domain)).size}</strong><span class="muted">已接触领域数</span></div><div class="stat"><strong>${Math.max(0,domains.length-new Set(rows.map(x=>x.domain)).size)}</strong><span class="muted">还可继续探索的方向</span></div><div class="stat"><strong>${rows.filter(x=>x.note?.trim()).length}</strong><span class="muted">条自主体验笔记</span></div></div><div class="task-actions"><button class="btn" id="exportJSON">导出JSON备份</button><button class="btn" id="exportCSV">导出CSV</button><label class="btn">导入JSON<input type="file" accept="application/json,.json" id="importJSON" hidden></label><button class="btn" id="clearAll">清空本机记录</button></div><div class="note">探索不会自动限制你的选择。无论之前表现如何，都鼓励接触尚未尝试的其他领域。</div>${rows.length?rows.slice().reverse().map(r=>`<div class="recorditem"><div><b>${esc(r.title)} <span class="pill">${esc(r.domain)}</span></b><div class="tiny muted">${esc(r.date)} · ${esc(r.result||'已完成')}</div><div style="margin-top:6px">${esc(r.note||'尚未填写心得')}</div></div><button class="btn small" data-delete="${esc(r.id)}">删除</button></div>`).join(''):`<div class="empty">这里暂时没有记录。可以先尝试一项从未接触过的互动体验。<p><button class="btn primary" data-go="experiences">开始探索</button></p></div>`}</div>`}
function consent(k){const d=tasks[k];return `${header('PARTICIPATION','开始 ${d.title}','这是一项研究性互动演示，不会判定先天禀赋，也不会对你进行未来职业推荐。')}<div class="wrap"><div class="task"><h3>自愿参与说明</h3><p>此任务有${d.rounds}个回合，记录仅保存在你的浏览器内。你可以随时关闭页面退出。参与者须满18周岁；未成年人目前只允许查看科普与领域地图。</p><label class="radiocheck"><input id="adultConsent" type="checkbox">我已年满18周岁，自愿参加互动体验。</label><label class="radiocheck"><input id="studyConsent" type="checkbox">我明白此演示未经信效度验证，不代表天赋或能力鉴定。</label><div class="task-actions"><button class="btn primary" id="confirmTask" disabled>开始</button><button class="btn" data-go="experiences">返回体验中心</button></div></div></div>`}
function taskLayout(d,body,progress){return `${header('EXPERIENCE LAB',d.title,d.desc)}<div class="wrap"><div class="task"><div class="taskhead"><span class="badge">${d.domain}</span><span class="tiny muted">第 ${Math.min(T.round+1,d.rounds)} / ${d.rounds} 回合</span></div><div class="stagebar"><div style="width:${100*T.round/d.rounds}%"></div></div>${body}<div class="hint">仅为体验与研究任务，不代表任何先天能力或职业适合度。</div><div class="task-actions"><button class="btn small" id="quitTask">退出体验</button></div></div></div>`}
function gearTask(){const n=[3,4,5][T.round],initial=T.round===1?'逆时针':'顺时针',clock=initial==='顺时针',correct=((n-1)%2===0)===clock?'顺时针':'逆时针';T.correct=correct;let gs='';for(let i=0;i<n;i++){const x=58+i*78;gs+=`<g transform="translate(${x} 110)" class="gear" style="transform-origin:${x}px 110px;animation-duration:${1+i*.18}s;animation-direction:${i%2?'reverse':'normal'}"><circle r="35" fill="${i===0?'#d7eee8':'#e6f0f1'}" stroke="#326c76" stroke-width="3"/>${Array.from({length:12},(_,j)=>`<rect x="-7" y="-43" width="14" height="15" rx="3" fill="#477f88" transform="rotate(${j*30})"/>`).join('')}<circle r="12" fill="#fff" stroke="#326c76" stroke-width="3"/><path d="M0 -8 L5 4 L0 1 L-5 4 Z" fill="#19536b"/></g>`}const body=`<div class="round">机械传动 · 探索关系</div><h3>当第1个齿轮${initial}转动，第${n}个会怎样？</h3><p class="muted tiny">先预测，再选择“查看运行规律”了解原因。所有齿轮依次啮合。</p><div class="svgboard"><svg viewBox="0 0 ${Math.max(450,n*78+35)} 210" width="100%" aria-label="相邻咬合齿轮图">${gs}</svg></div><div class="choices"><button class="choice" data-answer="顺时针">顺时针</button><button class="choice" data-answer="逆时针">逆时针</button></div><div id="taskFeedback"></div>`;return taskLayout(tasks.gear,body)}
function resourceTask(){const contexts=[['实验室计划','需要兼顾试验、维护和储备。'],['紧急交付','必须处理眼前的交付压力，也不能忽略未来。'],['预算削减','资源更紧张，尝试在短期与长期之间寻找平衡。'],['突发故障','给维护与备用资源留出空间，会减少系统风险。']];const [title,desc]=contexts[T.round];return taskLayout(tasks.resource,`<div class="round">动态系统 · 资源配置</div><h3>${title}</h3><p>${desc}</p><p class="tiny muted">总资源100单位。移动三个滑块，探索不同分配的结果。不存在绝对正确答案。</p>${[['explore','探索研发'],['deliver','当下执行'],['reserve','维护储备']].map(([k,label])=>`<div class="control-row"><label for="${k}">${label}</label><input type="range" id="${k}" min="0" max="100" step="5" value="${T.rsrc[k]}"><b id="${k}Val">${T.rsrc[k]}</b></div>`).join('')}<p class="tiny" id="budgetInfo"></p><div class="task-actions"><button class="btn teal" id="simulate">运行一次模拟</button></div><div id="taskFeedback"></div>`)}
const rhythmQs=[{a:[0,260,520,890],b:[0,260,520,890]},{a:[0,250,600,880],b:[0,250,540,880]},{a:[0,320,650,930],b:[0,320,650,930]},{a:[0,230,480,820],b:[0,230,480,990]}];let audioCtx=null;function playPattern(xs){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime+.06;xs.forEach(ms=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=now+ms/1000;o.type='sine';o.frequency.value=640;g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(.13,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.18)})}catch{toast('当前设备无法播放声音，请检查声音权限')}}function rhythmTask(){return taskLayout(tasks.rhythm,`<div class="round">听觉 · 时序辨别</div><h3>两组声音节奏是否相同？</h3><p class="tiny muted">每组包含4次提示音。可以分别重听，判断两段节奏间隔是否一致。</p><div class="svgboard" style="min-height:160px"><div class="center"><div style="font-size:42px;color:var(--teal)">♪　♪　♪　♪</div><p class="muted tiny">请打开设备音量，保证环境安静</p></div></div><div class="choices"><button class="btn" id="playA">▶ 听节奏 A</button><button class="btn" id="playB">▶ 听节奏 B</button></div><div class="choices"><button class="choice" data-answer="相同">相同</button><button class="choice" data-answer="不同">不同</button></div><div id="taskFeedback"></div>`)}
const creatQ=[['一把旧雨伞','除了遮雨，还能有哪些用途？'],['一只空纸箱','在不同的生活场景里，它能解决什么问题？']];function creativeTask(){const [ob,q]=creatQ[T.round];return taskLayout(tasks.creative,`<div class="round">创造 · 多解探索</div><h3>${ob}：${q}</h3><p class="muted tiny">试着提出至少两个不同想法。内容由你自己记录，系统不判断它们是否“原创”或“高水平”。</p><label class="field" for="ideas">你的想法（可以分行）</label><textarea id="ideas" class="textinput" rows="6" placeholder="第一个想法…\n第二个想法…">${esc(T.ideas||'')}</textarea><div class="task-actions"><button class="btn teal" id="saveIdeas">保存并进入下一场景</button></div><div id="taskFeedback"></div>`)}
function svgShape(angle){return `<svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true"><g transform="rotate(${angle} 60 60)"><path d="M24 26 H88 V48 H60 V92 H24 Z" fill="#def1ed" stroke="#1c6170" stroke-width="4" stroke-linejoin="round"/><circle cx="38" cy="40" r="6" fill="#df996b"/><path d="M74 31 L87 38 L74 45" fill="none" stroke="#155c66" stroke-width="3"/></g></svg>`}function rotateTask(){const base=[0,90,180,270,0][T.round];const correct=(base+90)%360;T.correct=String(correct);return taskLayout(tasks.rotate,`<div class="round">空间 · 结构旋转</div><h3>将左侧结构顺时针旋转90°，会变成哪个选项？</h3><div class="svgboard" style="min-height:165px"><div class="center">${svgShape(base)}<div class="tiny muted">原始结构</div></div></div><div class="choices">${[0,90,180,270].map((a,i)=>`<button class="choice" data-answer="${a}" style="padding:6px 14px;min-width:110px">${svgShape(a)}<div class="tiny">选项 ${i+1}</div></button>`).join('')}</div><div id="taskFeedback"></div>`)}
function finishTask(){const d=tasks[T.kind];return `${header('REFLECTION','体验完成：'+d.title,'一次活动只能产生体验线索，不能证明先天能力或预测未来发展。')}<div class="wrap"><div class="task"><div class="round">EXPLORATION COMPLETE</div><h3>这次体验让你发现了什么？</h3><p class="muted">${T.kind==='creative'?'你的想法已经记录在本次活动中。':`已完成 ${d.rounds} 个回合。${T.score===null?'':`在此演示中的回答情况：${T.score}/${d.rounds}。`}`} 不同领域的任务指标不可相互排名。</p><label class="field" for="reflection">你的个人感受（可选）</label><textarea id="reflection" class="textinput" placeholder="例如：哪里让我感到轻松？哪里有困难？有没有想继续尝试的方向？"></textarea><div class="task-actions"><button class="btn teal" id="storeRecord">保存本次体验</button><button class="btn" id="tryAgain">重新体验</button><button class="btn" data-go="map">探索其它领域</button></div><p class="hint">保存仅发生在本设备的浏览器中。你可以随时在“我的探索”中导出或删除记录。</p></div></div>`}
function render(){route=location.hash.slice(1)||'home';const key=route.split('/')[0];for(const n of document.querySelectorAll('.navlink'))n.classList.toggle('active',n.dataset.nav===key||(key==='task'&&n.dataset.nav==='experiences'));const app=$('#app');let out;if(route==='home')out=home();else if(route==='map')out=mapPage();else if(route==='experiences')out=experiences();else if(route==='records')out=records();else if(route==='research')out=research();else if(route.startsWith('consent/'))out=consent(route.split('/')[1]);else if(route.startsWith('task/')&&T){const d=tasks[T.kind];if(T.round>=d.rounds)out=finishTask();else out=({gear:gearTask,resource:resourceTask,rhythm:rhythmTask,creative:creativeTask,rotate:rotateTask})[T.kind]()}else out=home();app.innerHTML=out;bind();}
function startTask(k){if(!tasks[k])return;T={kind:k,round:0,score:k==='creative'||k==='resource'?null:0,choices:[],rsrc:{explore:30,deliver:40,reserve:30},ideas:'',notes:[]};navTo('consent/'+k)}function routeTask(){navTo('task/'+T.kind)}
function answered(value){if(!T)return;const d=tasks[T.kind];let correct=false;if(T.kind==='gear'||T.kind==='rotate')correct=value===T.correct;else if(T.kind==='rhythm')correct=value===(rhythmQs[T.round].a.join()==rhythmQs[T.round].b.join()?'相同':'不同');else return;T.choices.push({round:T.round+1,response:value,correct});if(correct)T.score++;const box=$('#taskFeedback');box.innerHTML=`<div class="feedback"><b>${correct?'本题判断符合模拟规则。':'本题没有匹配模拟规则。'}</b> ${T.kind==='gear'?'相邻两只齿轮转向相反；可沿传动链逐一推导。':T.kind==='rhythm'?'两组节奏的时间间隔决定它们是否一致。':'非对称结构的方向在每次顺时针90°旋转后发生变化。'}</div><button class="btn teal" id="nextRound">${T.round+1<d.rounds?'下一回合':'完成体验'}</button>`;document.querySelectorAll('[data-answer]').forEach(e=>e.disabled=true);$('#nextRound').onclick=()=>{T.round++;routeTask()}}
function resourceSim(){const {explore:e,deliver:d,reserve:r}=T.rsrc;const penalty=Math.abs(100-e-d-r);if(penalty){toast('请将总资源调整到100');return}const w=T.round;const productivity=Math.max(0,Math.min(100,Math.round(d*(w===1?1.45:1.2)+e*.35+(r>15?6:0))));const resilience=Math.max(0,Math.min(100,Math.round(r*(w===3?2:1.45)+e*.33)));const future=Math.max(0,Math.min(100,Math.round(e*1.7+r*.2)));T.choices.push({round:T.round+1,alloc:{...T.rsrc},result:{productivity,resilience,future}});const msg=(productivity<48?'即时执行压力较高。':'当下执行表现较好。')+' '+(resilience<38?'系统应对突发变化的余地有限。':'储备提供了一定稳定性。');$('#taskFeedback').innerHTML=`<div class="results"><div class="result">执行表现<b>${productivity}</b></div><div class="result">应变能力<b>${resilience}</b></div><div class="result">长期探索<b>${future}</b></div></div><div class="feedback">${msg}这些值只是本网页的模拟反馈，不是对人的能力评分。</div><button class="btn teal" id="nextRound">${T.round+1<tasks.resource.rounds?'尝试下一个情境':'完成体验'}</button>`;$('#simulate').disabled=true;$('#nextRound').onclick=()=>{T.round++;T.rsrc={explore:30,deliver:40,reserve:30};routeTask()}}
function bind() {
  document.querySelectorAll('[data-nav]').forEach(el => {el.onclick = () => navTo(el.dataset.nav)});
  document.querySelectorAll('[data-go]').forEach(el => {
    el.onclick = () => navTo(el.dataset.go);
  });
  document.querySelectorAll('[data-start]').forEach(el => {
    el.onclick = () => startTask(el.dataset.start);
  });
  if (route.startsWith('consent/')) {

    [a,b].forEach(el => el.addEventListener('change', () => {
      c.disabled = !(a.checked && b.checked);

    c.onclick = () => routeTask();
  }
  if (route.startsWith('task/') && T) {

    document.querySelectorAll('[data-answer]').forEach(el => {
      el.onclick = () => answered(el.dataset.answer);

    if (T.kind === 'resource' && T.round < tasks.resource.rounds) {
      for (const k of ['explore','deliver','reserve']) {
        $('#'+k).oninput = e => {
          T.rsrc[k] = +e.target.value;
          $('#'+k+'Val').textContent = e.target.value;
          const sum = Object.values(T.rsrc).reduce((x,y)=>x+y,0);
          $('#budgetInfo').textContent = '当前已分配 ' + sum + ' / 100；请调整为恰好100。';
          $('#simulate').disabled = sum !== 100;
        };
      }
      $('#budgetInfo').textContent = '当前已分配100 / 100。';
      $('#simulate').onclick = resourceSim;
    }
    if (T.kind === 'rhythm' && T.round < tasks.rhythm.rounds) {
      $('#playA').onclick = () => playPattern(rhythmQs[T.round].a);
      $('#playB').onclick = () => playPattern(rhythmQs[T.round].b);
    }
    if (T.kind === 'creative' && T.round < tasks.creative.rounds) {
      $('#saveIdeas').onclick = () => {
        const s = $('#ideas').value.trim();
        if(s.length<7) {toast('请先写下至少一个完整想法'); return;}
        T.choices.push({round:T.round+1,ideas:s});
        T.round++;
        T.ideas='';
        routeTask();
      };
    }
    if (T.round >= tasks[T.kind].rounds) {
      $('#tryAgain').onclick = () => startTask(T.kind);
      $('#storeRecord').onclick = () => {
        const d = tasks[T.kind], note = $('#reflection').value.trim();
        state.records.push({
          id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8),
          key:T.kind,title:d.title,domain:d.domain,date:new Date().toLocaleString('zh-CN'),
          result:T.score===null?'已完成开放式体验':`完成 ${d.rounds} 回合（本任务 ${T.score} 次符合规则）`,
          note,details:T.choices
        });
        save();toast('已保存到本机浏览器');T=null;navTo('records');
      };
    }
  }
  if (route==='records') {
    $('#exportJSON').onclick = () => download('qianxing-exploration.json',JSON.stringify({format:'qianxing.v03',records:state.records},null,2),'application/json');
    $('#exportCSV').onclick = () => {
      const rows=[['日期','任务','领域','体验','个人感受'],...state.records.map(x=>[x.date,x.title,x.domain,x.result,x.note||''])];
      download('qianxing-exploration.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv');
    };
    $('#clearAll').onclick=()=>{
      if(confirm('确定清空当前浏览器中的全部潜星体验记录？此操作无法撤销。')){
        state.records=[];save();render();toast('本机记录已清空');
      }
    };
    $('#importJSON').onchange=async e=>{
      const file=e.target.files?.[0];if(!file)return;
      try{
        const x=JSON.parse(await file.text());const rs=x.records;
        if(!Array.isArray(rs)||rs.length>20000||!rs.every(v=>v&&typeof v==='object'&&typeof v.title==='string'&&typeof v.domain==='string'))throw Error('数据格式不符合潜星记录结构');
        if(!confirm(`准备导入 ${rs.length} 条记录，将与本机原有记录合并。继续吗？`))return;
        const ids=new Set(state.records.map(r=>r.id));
        for(const r of rs)if(!ids.has(r.id)){state.records.push(r);ids.add(r.id);}
        save();render();toast('导入完成');
      }catch{toast('导入失败，请选择先前导出的潜星JSON文件');}
    };
    document.querySelectorAll('[data-delete]').forEach(el=>{
      el.onclick=()=>{
        if(confirm('删除这条体验记录？')){
          state.records=state.records.filter(r=>r.id!==el.dataset.delete);save();render();
        }
      };
    });
  }
}
function download(name,content,type){const b=new Blob([content],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script>
</body>
</html>
