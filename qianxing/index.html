<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="潜星计划：从108个小挑战中选择一项，轻松体验，慢慢发现自己的兴趣与优势。">
<title>潜星计划｜从一个小挑战开始</title>
<style>
:root{--ink:#172e2a;--muted:#66746f;--accent:#176b5c;--line:#e5eae7}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid #6aab9b;outline-offset:4px}
.shell{width:min(100% - 44px,860px);margin-inline:auto}
.site-header{border-bottom:1px solid var(--line)}
.site-header .shell{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:17px;font-weight:800;letter-spacing:.04em}
.nav{font-size:14px;color:#52645e}
.nav:hover,.quiet:hover{color:var(--accent)}
.hero{padding-top:clamp(84px,15vh,155px);padding-bottom:120px;flex:1}
.eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.06em}
h1{font-size:clamp(40px,6.5vw,66px);letter-spacing:-.055em;line-height:1.24;margin:20px 0 22px;font-weight:800}
.lead{color:var(--muted);font-size:clamp(16px,2vw,19px);max-width:530px;margin:0}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:26px;margin-top:38px}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:36px;min-height:54px;background:var(--accent);color:white;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:700;transition:background .15s}
.primary:hover{background:#10594d}
.quiet{font-size:15px;color:#455c53;font-weight:600}
.last{font-size:13px;color:#83908a;margin-top:17px}
footer{padding:23px 0 28px;border-top:1px solid var(--line);color:#88928d;font-size:12px}
@media(max-width:600px){.shell{width:min(100% - 36px,860px)}.hero{padding-top:90px;padding-bottom:80px}.actions{gap:21px}.primary{width:100%;justify-content:space-between}.quiet{padding:8px 0}h1{letter-spacing:-.045em}}
@media(prefers-reduced-motion:reduce){.primary{transition:none}}
</style>
</head>
<body>
<header class="site-header"><div class="shell"><a class="brand" href="./">潜星计划</a><a class="nav" href="./explore/">全部项目</a></div></header>
<main class="hero shell">
  <span class="eyebrow">108 项自由探索</span>
  <h1>你的可能，<br>不止一种。</h1>
  <p class="lead">从一个小挑战开始，试试自己感兴趣的事。</p>
  <div class="actions">
    <a class="primary" id="start" href="./music/?first=1">开始探索 <span aria-hidden="true">→</span></a>
    <a class="quiet" href="./explore/">查看全部 108 项</a>
  </div>
  <p class="last" id="last-note" hidden>会记住你上次打开的项目，仅保存在当前浏览器。</p>
</main>
<footer><div class="shell">自由探索，不做天赋鉴定。</div></footer>
<script>
(function(){
  var last=0;
  try{last=Number(localStorage.getItem("qianxing-last-id")||0)}catch(e){}
  var start=document.getElementById("start");
  if(Number.isInteger(last)&&last>=1&&last<=108){
    start.href=last===1?"./music/?first=1":last===2?"./vision/":"./labs/?id="+last;
    start.innerHTML="继续探索 <span aria-hidden=\"true\">→</span>";
    var note=document.getElementById("last-note");
    note.hidden=false;
    note.textContent="上次浏览：第 "+String(last).padStart(2,"0")+" 项";
  }
  start.addEventListener("click",function(){
    try{if(!last)localStorage.setItem("qianxing-last-id","1")}catch(e){}
  });
})();
</script>
</body>
</html>
