name: Deploy combined Pan Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build site and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Mark classic 50K deployment pending
        shell: bash
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"pan-pages/50k-classic","description":"正在构建木质绿色横屏牌桌"}'

      - name: Checkout pan site
        uses: actions/checkout@v4

      - name: Checkout verified Henan 50K source
        uses: actions/checkout@v4
        with:
          repository: panxiangbin/-K
          ref: main
          path: .build/henan-50k

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .build/henan-50k/client/package-lock.json

      - name: Test and build Henan 50K for nested Pages path
        working-directory: .build/henan-50k/client
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm test
          DEPLOY_TARGET=github-pages PAGES_BASE_PATH=/pan/50k/ npm run build

      - name: Assemble existing site with Henan 50K
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.build' \
            --exclude '_site'
          rm -rf _site/50k
          mkdir -p _site/50k
          cp -R .build/henan-50k/client/dist/. _site/50k/
          touch _site/.nojekyll
          test -s _site/50k/index.html
          test -s _site/50k/audio/langaishou-v2.mp3
          grep -q '/pan/50k/assets/' _site/50k/index.html
          grep -R -q 'landscape-r3' _site/50k/assets
          grep -R -q 'r3-visible-home' _site/50k/assets
          grep -R -q 'compact-guidance-final' _site/50k/assets
          grep -R -q '请横屏使用' _site/50k/assets
          grep -R -q '直接进入横屏' _site/50k/assets
          grep -R -q 'force-landscape-active' _site/50k/assets
          grep -R -q 'actionStatusKind' _site/50k/assets
          grep -R -q 'clean-landscape-v1' _site/50k/assets
          if grep -R -q 'tech-landscape-v2' _site/50k/assets; then
            echo '科技 V2 标记仍存在，拒绝发布' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public 50K Pages matches this build
        shell: bash
        run: |
          set -euo pipefail
          expected_js="$(grep -oE '/pan/50k/assets/[^\" ]+\.js' _site/50k/index.html | head -n 1)"
          expected_css="$(grep -oE '/pan/50k/assets/[^\" ]+\.css' _site/50k/index.html | head -n 1)"
          test -n "$expected_js"
          test -n "$expected_css"

          for attempt in $(seq 1 30); do
            public_html="$(curl --fail --silent --show-error --location --retry 2 \
              "https://panxiangbin.github.io/pan/50k/?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$public_html" | grep -Fq "$expected_js" \
              && printf '%s' "$public_html" | grep -Fq "$expected_css"; then
              curl --fail --silent --show-error --location --retry 2 \
                "https://panxiangbin.github.io${expected_js}?deploy=${GITHUB_SHA}" \
                -o /tmp/public-50k.js
              curl --fail --silent --show-error --location --retry 2 \
                "https://panxiangbin.github.io${expected_css}?deploy=${GITHUB_SHA}" \
                -o /tmp/public-50k.css
              grep -q 'clean-landscape-v1' /tmp/public-50k.js
              grep -q 'game-screen-clean-v1' /tmp/public-50k.css
              grep -q 'trick-board-summary__meta' /tmp/public-50k.css
              echo "Public 50K Pages verified: $expected_js + $expected_css"
              exit 0
            fi
            echo "Public Pages still serving an older asset set (attempt ${attempt}/30)"
            sleep 10
          done

          echo "公开 Pages 在等待时间内未切换到本次构建资源" >&2
          exit 1

      - name: Mark classic 50K deployment successful
        shell: bash
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"success","context":"pan-pages/50k-classic","description":"木质绿色横屏牌桌已部署并核验公开地址"}'

      - name: Mark classic 50K deployment failed
        if: failure()
        shell: bash
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"failure","context":"pan-pages/50k-classic","description":"木质绿色横屏牌桌部署或公开地址核验失败"}'
